name: Mynzo Complete App Builder

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      # 1. आपके गिटहब से फाइलों को लोड करना
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. जावा एनवायरनमेंट सेटअप (Android बिल्ड के लिए अनिवार्य)
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. फ़्लटर एनवायरनमेंट सेटअप
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: false

      # 🚀 यह स्टेप आपके लिए पूरा Android फ़ोल्डर और Gradle फ़ाइलें खुद बना देगा!
      - name: Auto Generate Android Structure & Inject Files
        run: |
          echo "=== फ्रेश एंड्रॉइड प्रोजेक्ट ढांचा और आवश्यक फाइलें तैयार की जा रही हैं ==="
          
          # 1. आपकी अपलोड की हुई मुख्य फाइलों का बैकअप लेना
          mkdir -p ../backup_lib
          mkdir -p ../backup_assets
          
          if [ -f "lib/main.dart" ]; then cp lib/main.dart ../backup_lib/main.dart; fi
          if [ -f "main.dart" ]; then cp main.dart ../backup_lib/main.dart; fi
          if [ -f "pubspec.yaml" ]; then cp pubspec.yaml ../backup_pubspec.yaml; fi
          if [ -d "assets/images" ] && [ "$(ls -A assets/images)" ]; then cp -r assets/images/* ../backup_assets/ || true; fi
          if [ -f "logo.png" ]; then cp logo.png ../backup_assets/logo.png; fi
          
          # 2. पूरी रिपॉजिटरी को साफ करके एक फ्रेश फ्लटर प्रोजेक्ट (Android फ़ोल्डर के साथ) बनाना
          rm -rf * .github || true
          flutter create --org com.mynzo --project-name mynzo_app .
          
          # 3. बैकअप से आपकी कोडिंग और लोगो को नई जगह पर फिट करना
          mkdir -p lib
          mkdir -p assets/images
          
          if [ -f "../backup_lib/main.dart" ]; then
            cp ../backup_lib/main.dart lib/main.dart
            echo "✓ main.dart को सफलतापूर्वक सेट कर दिया गया है।"
          fi
          
          # लोगो इमेज को सही पाथ पर डालना
          LOGO_FILE=$(find ../backup_assets -type f | head -n 1)
          if [ ! -z "$LOGO_FILE" ]; then
            cp "$LOGO_FILE" assets/images/logo.png
            echo "✓ logo.png को एसेट्स में इंजेक्ट कर दिया गया है।"
          else
            touch assets/images/logo.png
          fi
          
          if [ -f "../backup_pubspec.yaml" ]; then
            cp ../backup_pubspec.yaml pubspec.yaml
            echo "✓ pubspec.yaml को री-इंजेक्ट कर दिया गया है।"
          fi
          
          echo "=== नया और 100% परफेक्ट एंड्रॉइड लेआउट तैयार है ==="

      # 4. पुराने कैशे साफ़ करना
      - name: Clean Flutter Cache
        run: flutter clean

      # 5. डिपेंडेंसीज़ इंस्टॉल करना
      - name: Install Dependencies
        run: flutter pub get

      # 6. बिना किसी Gradle एरर के रिलीज़ APK बिल्ड करना
      - name: Build Android APK
        run: flutter build apk --release --no-tree-shake-icons --no-pub

      # 7. तैयार हुई APK फ़ाइल को डाउनलोड के लिए GitHub पर अपलोड करना
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
